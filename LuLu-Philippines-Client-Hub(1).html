    (()=&gt;{
      const root=document.getElementById(&#x27;lulu-premium-hub&#x27;);

      const motionButton=root.querySelector(&#x27;#lp-motion&#x27;);
      const reduceMotion=window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      let selected=&#x27;all&#x27;;let lastOpened=null;let videoTimer=null;let videoIndex=0;let motionPaused=reduceMotion.matches;
      const videoTitle=root.querySelector(&#x27;#lp-video-title&#x27;);

      const videoCaption=root.querySelector(&#x27;#lp-video-caption&#x27;);
      const slides=[&#x27;The beginning of a better connection.&#x27;,&#x27;Meet LuLu Philippines.&#x27;,&#x27;Explore your company documents.&#x27;,&#x27;Find the images and tools you need.&#x27;,&#x27;Your next step starts here.&#x27;];
      function stopVideo(){if(videoTimer!==null){clearInterval(videoTimer);videoTimer=null;}videoPlay.querySelector(&#x27;span&#x27;).textContent=videoIndex&gt;=slides.length-1?&#x27;Replay sample&#x27;:&#x27;Play sample&#x27;;}
      function closePreview(restoreFocus=false){stopVideo();preview.hidden=true;grid.hidden=false;if(restoreFocus&amp;&amp;lastOpened&amp;&amp;!lastOpened.hidden)lastOpened.focus();}
      function setFilter(kind){selected=kind;closePreview();filters.forEach(tab=&gt;tab.setAttribute(&#x27;aria-selected&#x27;,String(tab.dataset.filter===kind)));cards.forEach(card=&gt;{card.hidden=kind!==&#x27;all&#x27;&amp;&amp;card.dataset.kind!==kind;});collection.setAttribute(&#x27;aria-labelledby&#x27;,&#x27;lp-tab-&#x27;+kind);}
      function setNav(name){root.querySelectorAll(&#x27;[data-nav]&#x27;).forEach(item=&gt;item.setAttribute(&#x27;aria-pressed&#x27;,String(item.dataset.nav===name)));}
      function goToLibrary(kind){setFilter(kind);setNav(kind===&#x27;tools&#x27;?&#x27;tools&#x27;:&#x27;resources&#x27;);library.scrollIntoView({behavior:reduceMotion.matches?&#x27;auto&#x27;:&#x27;smooth&#x27;,block:&#x27;start&#x27;});}
      filters.forEach((tab,index)=&gt;{
        tab.addEventListener(&#x27;click&#x27;,()=&gt;{setFilter(tab.dataset.filter);setNav(tab.dataset.filter===&#x27;tools&#x27;?&#x27;tools&#x27;:&#x27;resources&#x27;);});
        tab.addEventListener(&#x27;keydown&#x27;,event=&gt;{let target=null;if(event.key===&#x27;ArrowRight&#x27;)target=filters[(index+1)%filters.length];if(event.key===&#x27;ArrowLeft&#x27;)target=filters[(index+filters.length-1)%filters.length];if(event.key===&#x27;Home&#x27;)target=filters[0];if(event.key===&#x27;End&#x27;)target=filters[filters.length-1];if(target){event.preventDefault();target.focus();target.click();}});

      root.querySelectorAll(&#x27;[data-jump]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;goToLibrary(button.dataset.jump)));
      root.querySelectorAll(&#x27;[data-nav]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{
        if(button.dataset.nav===&#x27;overview&#x27;){setFilter(&#x27;all&#x27;);setNav(&#x27;overview&#x27;);root.querySelector(&#x27;#lp-overview&#x27;).scrollIntoView({behavior:reduceMotion.matches?&#x27;auto&#x27;:&#x27;smooth&#x27;,block:&#x27;start&#x27;});}

      const detailLabels={document:&#x27;Sample document preview&#x27;,video:&#x27;Animated sample&#x27;,gallery:&#x27;Brand &amp; image collection&#x27;,checklist:&#x27;Interactive client checklist&#x27;};
      cards.forEach(card=&gt;{
        card.addEventListener(&#x27;click&#x27;,()=&gt;{lastOpened=card;stopVideo();root.querySelectorAll(&#x27;[data-detail]&#x27;).forEach(detail=&gt;{detail.hidden=detail.dataset.detail!==card.dataset.open;});root.querySelector(&#x27;#lp-preview-label&#x27;).textContent=detailLabels[card.dataset.open];grid.hidden=true;preview.hidden=false;root.querySelector(&#x27;#lp-back&#x27;).focus({preventScroll:true});});

    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();

</script>
</body>
</html>
