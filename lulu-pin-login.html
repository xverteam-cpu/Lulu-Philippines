<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007b3e"><title>LuLu · PIN login concept</title>
<style>
:root{--green:#007b3e;--dark:#063d29;--lime:#d2ec65;--ink:#193b2c;--muted:#738077}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#edf2ed;color:var(--ink);min-height:100svh;display:grid;place-items:center;padding:36px}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #95bd3c;outline-offset:5px}.shell{width:min(1050px,100%);display:grid;grid-template-columns:1fr 450px;min-height:740px;background:white;border-radius:28px;overflow:hidden;box-shadow:0 24px 90px #153e2414}.story{background:var(--green);color:white;padding:46px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}.wordmark{font-family:Arial,sans-serif;font-size:45px;letter-spacing:-4px;font-weight:900;line-height:1}.brand-sub{font-size:10px;letter-spacing:3px;margin-top:10px;font-weight:600}.story-copy{position:relative;z-index:1;margin:55px 0 20px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--lime)}h1{font-size:54px;line-height:1.07;letter-spacing:-2.6px;margin:23px 0}h1 span{color:var(--lime)}.story p{font-size:15px;line-height:1.8;color:#d8eee1;max-width:290px}.shape{position:absolute;width:440px;height:440px;border:1px solid #ffffff18;border-radius:50%;right:-235px;bottom:45px;box-shadow:0 0 0 50px #ffffff06,0 0 0 100px #ffffff05,0 0 0 150px #ffffff04}.story-foot{font-size:11px;letter-spacing:1px;color:#d8eee1;position:relative}.login{padding:28px 48px 25px;display:flex;flex-direction:column;align-items:center;position:relative}.topbar{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:26px}.mini-brand{font-size:30px;letter-spacing:-3px;font-weight:900;color:var(--green)}.help{border:1px solid #e4eae5;border-radius:30px;background:white;padding:8px 12px;font-size:11px;color:#597060}.avatar{height:60px;width:60px;border-radius:22px;background:#eff7ec;color:var(--green);display:grid;place-items:center;margin:4px 0 15px}.avatar svg{width:28px;height:28px}.welcome{font-size:13px;color:var(--muted);margin:0 0 6px}h2{font-size:28px;letter-spacing:-1px;margin:0 0 9px;font-weight:650}.subtitle{font-size:13px;color:var(--muted);margin:0;text-align:center}.pins{display:flex;gap:18px;justify-content:center;margin:28px 0 15px}.dot{width:17px;height:17px;border:1.5px solid #cbd7ce;border-radius:50%;transition:background .15s,transform .15s}.dot.filled{background:var(--green);border-color:var(--green);transform:scale(1.05)}.pins.error .dot{border-color:#c54040;background:#c54040}.status{height:32px;font-size:12px;text-align:center;color:var(--muted);margin:0}.status.error{color:#b43232}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 14px;width:100%;margin:4px 0 12px}.key{height:61px;border:0;background:#f6f8f5;border-radius:17px;color:var(--ink);font-size:27px;font-weight:500;transition:background .15s,transform .12s}.key:hover{background:#e9f2e6}.key:active{transform:scale(.94);background:#deecd8}.key.action{background:transparent;display:grid;place-items:center;font-size:13px}.key svg{width:25px;height:25px}.forgot{color:var(--green);border:0;background:transparent;font-size:12px;font-weight:700;padding:12px;margin-bottom:13px}.bottom{width:100%;text-align:center;margin-top:auto;border-top:1px solid #edf0ec;padding-top:17px}.bottom p{font-size:11px;color:var(--muted);margin:0 0 8px}.demo{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:7px 11px;border-radius:20px;background:#f2f6ef;color:#597060}.demo b{color:var(--green);letter-spacing:2px}.success{display:none;text-align:center;width:100%;margin:auto 0}.success .avatar{margin:0 auto 25px;width:78px;height:78px;background:var(--green);color:white}.success p{font-size:14px;color:var(--muted);line-height:1.7}.primary{background:var(--green);color:white;border:0;border-radius:14px;padding:16px 25px;width:100%;margin-top:22px;font-weight:600}.entry{display:contents}dialog{border:0;border-radius:22px;padding:28px;width:min(360px,calc(100% - 40px));color:var(--ink);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#05271666;backdrop-filter:blur(4px)}dialog h3{margin:0 0 12px;font-size:22px}dialog p{font-size:14px;line-height:1.7;color:#657369}dialog .primary{margin-top:10px}.shake{animation:shake .3s}@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}@media(max-width:800px){body{padding:0;background:white}.shell{display:block;width:100%;max-width:450px;min-height:100svh;border-radius:0;box-shadow:none}.story{display:none}.login{min-height:100svh;padding:calc(20px + env(safe-area-inset-top)) 36px calc(20px + env(safe-area-inset-bottom))}.topbar{margin-bottom:30px}.keypad{gap:10px 16px}.key{height:64px}.bottom{margin-top:20px}.success{margin:auto 0}}@media(max-height:730px) and (max-width:800px){.login{padding-top:15px;padding-bottom:15px}.topbar{margin-bottom:16px}.avatar{width:48px;height:48px;margin-bottom:10px}.pins{margin-top:22px}.key{height:54px}.bottom{margin-top:5px}.forgot{margin-bottom:5px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Single-panel LuLu green theme, matching the supplied reference. */
body{background:#edf2ed}.shell{display:block;width:min(450px,100%);min-height:740px;background:var(--green);color:white;position:relative;isolation:isolate;box-shadow:0 24px 90px #004d2624}
.shell::before{content:"";position:absolute;z-index:-1;pointer-events:none;width:440px;height:440px;border:1px solid #ffffff0e;border-radius:50%;right:-320px;bottom:55px;box-shadow:0 0 0 50px #ffffff05,0 0 0 100px #ffffff04,0 0 0 150px #ffffff03}
.login{min-height:740px;background:transparent}.mini-brand{color:white;font-size:36px}.help{color:white;border-color:#ffffff40;background:#ffffff0a}.avatar{background:#ffffff13;color:var(--lime);border:1px solid #ffffff1c}.welcome,.subtitle,.status,.bottom p,.success p{color:#d8eee1}h2{color:white}.dot{border-color:#a4cbb4;background:transparent}.dot.filled{background:var(--lime);border-color:var(--lime)}.key{background:#ffffff0e;color:white;border:1px solid #ffffff1c}.key:hover{background:#ffffff20}.key:active{background:#ffffff30}.key.action{border-color:transparent}.forgot{color:var(--lime)}.bottom{border-color:#ffffff25}.demo{background:#005f30;color:#d8eee1}.demo b{color:var(--lime)}.pins.error .dot{background:#ffd2cc;border-color:#ffd2cc}.status.error{color:#ffe0da}.success .avatar{color:var(--dark);background:var(--lime)}.success .primary{background:var(--lime);color:var(--dark)}button:focus-visible{outline-color:var(--lime)}
@media(max-width:800px){body{background:var(--green)}.shell{min-height:100svh;max-width:450px}.login{min-height:100svh}}
</style>
</head>
<body>
<main class="shell">
<section class="login" aria-label="PIN login">
<header class="topbar"><div class="mini-brand" aria-label="LuLu">LuLu</div><button class="help" data-dialog="help">Need help?</button></header>
<div class="entry" id="entry">
<div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
<p class="welcome">Welcome back</p><h2>Enter your PIN</h2><p class="subtitle">Use your 4-digit PIN to continue.</p>
<div class="pins" id="pins" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<p class="status" id="status" role="status" aria-live="polite">Ready when you are.</p>
<div class="keypad" aria-label="PIN keypad">
<button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button>
<button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button>
<button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button>
<button class="key action" id="clear" aria-label="Clear PIN">Clear</button><button class="key" data-digit="0">0</button><button class="key action" id="backspace" aria-label="Delete last digit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-7-7z"/><path d="m12 9 6 6m0-6-6 6"/></svg></button>
</div><button class="forgot" data-dialog="forgot">Forgot PIN?</button>
</div>
<div class="success" id="success" role="status" tabindex="-1"><div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg></div><p class="welcome">You’re all set</p><h2>Welcome to LuLu.</h2><p>PIN flow completed successfully.<br>This is a design preview.</p><button class="primary" id="restart">Try again</button></div>
<footer class="bottom"><p>LuLu Philippines</p><div class="demo">INTERACTIVE DEMO <span aria-hidden="true">·</span> PIN <b>1234</b></div></footer>
</section></main>
<dialog id="modal" aria-labelledby="modal-title"><h3 id="modal-title"></h3><p id="modal-copy"></p><button class="primary" id="close">Got it</button></dialog>
<script>
// UI prototype only. No credentials are sent, logged, or persisted.
// Production: replace this demo check with server-side PIN verification,
// attempt limits, authenticated recovery, and secure session handling.
const $=s=>document.querySelector(s);let pin='',busy=false,done=false;
const dots=[...document.querySelectorAll('.dot')];
function render(){dots.forEach((dot,i)=>dot.classList.toggle('filled',i<pin.length));}
function reset(){pin='';render();$('#pins').classList.remove('error','shake');$('#status').classList.remove('error');$('#status').textContent='Ready when you are.';}
function digit(value){if(busy||done||$('#modal').open)return;if(pin.length===0)reset();pin+=value;render();$('#status').textContent=pin.length+' of 4 digits entered';if(pin.length===4)verify();}
function verify(){busy=true;$('#status').textContent='Checking demo PIN…';setTimeout(()=>{if(pin==='1234'){$('#entry').style.display='none';$('#success').style.display='block';done=true;$('#success').focus();pin='';render();busy=false;}else{$('#pins').classList.add('error','shake');$('#status').classList.add('error');$('#status').textContent='Incorrect PIN. Try 1234 for this demo.';setTimeout(()=>{pin='';render();$('#pins').classList.remove('error','shake');busy=false;},650);}},450);}
document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>digit(b.dataset.digit)));
function backspace(){if(busy||done)return;pin=pin.slice(0,-1);render();$('#status').classList.remove('error');$('#status').textContent=pin.length?pin.length+' of 4 digits entered':'Ready when you are.';}
$('#backspace').onclick=backspace;$('#clear').onclick=()=>{if(!busy)reset();};
document.addEventListener('keydown',e=>{if($('#modal').open||done||e.ctrlKey||e.metaKey||e.altKey)return;if(/^\d$/.test(e.key)){e.preventDefault();digit(e.key);}else if(e.key==='Backspace'){e.preventDefault();backspace();}else if(e.key==='Escape'&&!busy)reset();});
$('#restart').onclick=()=>{done=false;reset();$('#success').style.display='none';$('#entry').style.display='contents';document.querySelector('[data-digit]').focus();};
const messages={help:['A little help','Use the on-screen keypad or your keyboard to enter 1234. Clear removes all digits; the backspace key removes the last digit. This preview does not access a real account.'],forgot:['Reset your PIN','In the live app, verify your identity through your registered contact details before creating a new PIN. For this preview, use 1234.']};
document.querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>{const m=messages[b.dataset.dialog];$('#modal-title').textContent=m[0];$('#modal-copy').textContent=m[1];$('#modal').showModal();});$('#close').onclick=()=>$('#modal').close();
</script>
</body>
</html>
