<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lulu Franchise Application</title>
  <link rel="stylesheet" href="/franchise_application.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Franchise Application</h1>
      <p class="muted">Please complete the form below so our franchise team can review your application.</p>
      <form>
        <div class="grid">
          <div>
            <label for="full-name">Full Name</label>
            <input id="full-name" name="full_name" type="text" placeholder="Enter your full name" />
          </div>
          <div>
            <label for="email-address">Email Address</label>
            <input id="email-address" name="email_address" type="email" placeholder="Enter your email" />
          </div>
          <div>
            <label for="phone-number">Phone Number</label>
            <input id="phone-number" name="phone_number" type="tel" placeholder="Enter your phone number" />
          </div>
          <div>
            <label for="preferred-package">Preferred Package</label>
            <select id="preferred-package" name="preferred_package" title="Preferred Package">
              <option value="40">40 Pyeong</option>
              <option value="60">60 Pyeong</option>
            </select>
          </div>
          <div class="full">
            <label for="location">Location / Proposed Site</label>
            <input id="location" name="location" type="text" placeholder="Enter your preferred location" />
          </div>
          <div class="full">
            <label for="business-background">Business Background</label>
            <textarea id="business-background" name="business_background" placeholder="Share your experience and background"></textarea>
          </div>
          <div class="full">
            <label for="investment-capacity">Investment Capacity</label>
            <input id="investment-capacity" name="investment_capacity" type="text" placeholder="Estimated budget" />
          </div>
          <div class="full">
            <label for="additional-notes">Additional Notes</label>
            <textarea id="additional-notes" name="additional_notes" placeholder="Any additional information"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button">Submit Application</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
